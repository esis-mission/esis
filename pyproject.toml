[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "euv-snapshot-imaging-spectrograph"
authors = [
    {name = "Roy T. Smart", email = "roytsmart@gmail.com"},
]
description = "A Python library for modeling and interpreting data from the EUV Snapshot Imaging Spectrograph (ESIS)."
readme = "README.md"
requires-python = ">=3.12"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = [
    "ipython",
    "numpy",
    "matplotlib",
    "astropy~=7.2",
    "joblib",
    "pooch",
    "named-arrays~=2.8",
    "optika~=3.1",
    "msfc-ccd~=1.1",
    # TEMPORARY: the CHIANTI 11 temperature response (sun-data/solar-dynamics-observatory#28),
    # until it is released as 1.3.0
    "solar-dynamics-observatory @ git+https://github.com/sun-data/solar-dynamics-observatory.git@c8a0291f188ea77434a377d740d5f8bd55942c29",
    "interface-region-imaging-spectrograph~=1.0,>=1.0.1",
    # TEMPORARY: utu.spectrum.synthesize (sun-data/utu#14), until it is released as 0.4.0
    "utu @ git+https://github.com/sun-data/utu.git@feature/synthesize",
    "fiasco~=0.8.2",
]
dynamic = ["version"]

[project.optional-dependencies]
test = [
    "pytest",
]
doc = [
    "pytest",
    "matplotlib",
    "graphviz",
    "sphinx-autodoc-typehints",
    "sphinxcontrib-bibtex",
    "pydata-sphinx-theme",
    "ipykernel",
    "jupyter-sphinx",
    "nbsphinx",
    "sphinx-codeautolink",
    "sphinx-favicon",
]

[project.urls]
Homepage = "https://github.com/esis-mission/esis"
Documentation = "https://esis-mission.github.io"

[tool.setuptools]
packages = ["esis"]

[tool.setuptools_scm]

[tool.ruff.lint]
preview = true
select = [
    "E",
    "F",
    "D",
    "DOC",
]
ignore = [
    "DOC201",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"
