name: Preview Cleanup

permissions:
  contents: write

on:
  pull_request_target:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - run: mkdir -p empty_dir

      - name: Url slug variable
        run: |
          echo "URL_SLUG=${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.ref }}" >> $GITHUB_ENV

      # A pull request closed before its documentation finished building has
      # no preview to remove, and the deploy action fails rather than doing
      # nothing when it is asked to delete what is not there.
      - name: Look for a preview to remove
        id: preview
        run: |
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            "https://api.github.com/repos/esis-mission/esis-pr-previews/contents/${URL_SLUG}")
          echo "status $status for ${URL_SLUG}"
          if [ "$status" = "200" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy
        if: steps.preview.outputs.exists == 'true'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: empty_dir
          ssh-key: ${{ secrets.DEPLOY_KEY }}
          repository-name: esis-mission/esis-pr-previews
          branch: 'main'
          clean: true
          target-folder: ${{ env.URL_SLUG }}
          commit-message: "Remove preview for PR ${{ env.URL_SLUG }}"
          single-commit: true
          git-config-name: esis-bot
          git-config-email: roytsmart+esis-bot@gmail.com
