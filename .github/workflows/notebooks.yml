name: Notebooks

on:
  push:
    branches:
      - main
  pull_request:
    # ready_for_review is not a default type: without it, marking a draft
    # ready would not run the checks until the next push
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nbstripout:
    # drafts are free: the checks run once the pull request is marked ready
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install nbstripout
      - run: find . -name "*.ipynb" -exec nbstripout --verify {} +
