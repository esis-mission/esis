
name: tests

on:
  push:
    branches:
      - main
  pull_request:
    # ready_for_review is not a default type: without it, marking a draft
    # ready would not run the checks until the next push
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    # drafts are free: the checks run once the pull request is marked ready
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]
        python-version: ["3.12", "3.13"]
    name: ${{ matrix.os }}, Python ${{ matrix.python-version }} tests
    steps:
      - name: Set Swap Space
        if: runner.os == 'Linux'
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 8

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel
          pip install -e .

      # The synthetic scenes of `esis.data.synth.scene_dem` read the CHIANTI
      # atomic database, which is too large to fetch on every job of the
      # matrix, so the Linux jobs fetch it once and cache it, and the others
      # skip the tests which read it.
      - name: Ask fiasco which database it wants
        if: runner.os == 'Linux'
        id: chianti
        run: |
          python -c "
          from fiasco.util.setup_db import LATEST_VERSION
          print(f'version={LATEST_VERSION}')
          " >> $GITHUB_OUTPUT

      - name: Restore the CHIANTI database
        if: runner.os == 'Linux'
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/.fiasco
          key: chianti-${{ steps.chianti.outputs.version }}

      - name: Download and build the CHIANTI database
        if: runner.os == 'Linux' && steps.cache.outputs.cache-hit != 'true'
        run: |
          python -c "
          import fiasco
          from fiasco.util import check_database
          check_database(
              hdf5_dbase_root=fiasco.defaults['hdf5_dbase_root'],
              ascii_dbase_root=fiasco.defaults['ascii_dbase_root'],
              ask_before=False,
              show_progress=False,
          )
          "

      - name: Test with pytest
        env:
          MPLBACKEND: "agg"
          JSOC_EMAIL: "roytsmart@gmail.com"
        run: |
          pip install pytest pytest-cov
          pytest --cov=. --cov-report=xml --cov-report=html

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: unittests
          env_vars: OS,PYTHON
          name: codecov-umbrella
          fail_ci_if_error: true
